<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Simples</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="calculator" aria-label="Calculadora simples">
    <h1>Calculadora</h1>
    <input id="display" type="text" value="0" aria-label="Visor" readonly>
    <div class="keys">
      <button class="action span-2" data-action="clear">Limpar</button>
      <button class="action" data-action="backspace">⌫</button>
      <button class="operator" data-value="/">÷</button>
      <button data-value="7">7</button><button data-value="8">8</button><button data-value="9">9</button><button class="operator" data-value="*">×</button>
      <button data-value="4">4</button><button data-value="5">5</button><button data-value="6">6</button><button class="operator" data-value="-">−</button>
      <button data-value="1">1</button><button data-value="2">2</button><button data-value="3">3</button><button class="operator" data-value="+">+</button>
      <button class="span-2" data-value="0">0</button><button data-value=".">,</button><button class="equals" data-action="calculate">=</button>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
